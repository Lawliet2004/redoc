[package]
name = "redoc-desktop-tauri"
version = "0.1.0"
edition = "2021"
default-run = "redoc-desktop-tauri"

[features]
default = []
updater = ["dep:tauri-plugin-updater"]
telemetry = []

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
redoc-core = { path = "../../../crates/core" }
redoc-file-io = { path = "../../../crates/file-io" }
redoc-doc-engine = { path = "../../../crates/doc-engine" }
redoc-sheet-engine = { path = "../../../crates/sheet-engine" }
redoc-slide-engine = { path = "../../../crates/slide-engine" }
redoc-export = { path = "../../../crates/export" }

tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-updater = { version = "2.0", optional = true }

specta = { version = "=2.0.0-rc.20", features = ["derive"] }
specta-typescript = "0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["javascript", "typescript"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.11", features = ["v7"] }
