name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-2022
            bundles: nsis,msi
          - os: macos-14
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_WINDOWS_SIGNTOOL_PATH: ${{ secrets.TAURI_WINDOWS_SIGNTOOL_PATH }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:bindings
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm quality:check
        env:
          REDOC_RELEASE_CI: "1"
      - name: Generate signed updater configuration when configured
        if: ${{ env.TAURI_UPDATER_PUBLIC_KEY != '' && env.TAURI_UPDATER_ENDPOINT != '' }}
        run: pnpm create:updater-config
      - name: Select updater build arguments
        id: updater_args
        shell: bash
        run: |
          if [[ -n "$TAURI_UPDATER_PUBLIC_KEY" && -n "$TAURI_UPDATER_ENDPOINT" ]]; then
            echo "args=--bundles ${{ matrix.bundles }} --features updater --config apps/desktop/src-tauri/tauri.generated.release.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=--bundles ${{ matrix.bundles }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Redoc ${{ github.ref_name }}
          releaseBody: See the repository release notes for validation and known limitations.
          releaseDraft: true
          prerelease: true
          args: ${{ steps.updater_args.outputs.args }}
      - name: Installer size gate
        run: node scripts/installer-size-gate.mjs
        # Release-CI-only: fails if any built installer under target/release/bundle exceeds 55 MB.
      - name: Verify Windows artifact signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = if ($env:TAURI_WINDOWS_SIGNTOOL_PATH) { $env:TAURI_WINDOWS_SIGNTOOL_PATH } else { "signtool" }
          $bundles = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.msi,*.exe -ErrorAction SilentlyContinue
          foreach ($b in $bundles) {
            Write-Host "== Verifying signature: $($b.Name)"
            & $signtool verify /pa /all "$($b.FullName)" 2>$null
            if ($LASTEXITCODE -ne 0) {
              if ($env:WINDOWS_CERTIFICATE) { Write-Host "::error::Artifact not signed but WINDOWS_CERTIFICATE was provided: $($b.Name)"; exit 1 }
              else { Write-Host "::warning::Artifact is unsigned (no WINDOWS_CERTIFICATE secret configured): $($b.Name)" }
            } else { Write-Host "Signed OK: $($b.Name)" }
          }
      - name: Verify macOS artifact signing
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          for app in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            echo "== DMG present: $app (codesign verification happens at build time via APPLE_* secrets)"
          done
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::macOS artifacts are unsigned (no APPLE_CERTIFICATE secret configured)"
          fi
