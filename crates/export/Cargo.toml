[package]
name = "redoc-export"
version = "0.1.0"
edition = "2021"

[dependencies]
redoc-doc-engine = { path = "../doc-engine" }
redoc-sheet-engine = { path = "../sheet-engine" }
redoc-slide-engine = { path = "../slide-engine" }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
printpdf = { version = "0.7", features = ["embedded_images"] }
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
docx-rs = "0.4"
rust_xlsxwriter = "0.79"
calamine = "0.36"
quick-xml = "0.36"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
