[package]
name = "redoc-file-io"
version = "0.1.0"
edition = "2021"

[dependencies]
redoc-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
uuid = { version = "1.11", features = ["v7", "serde"] }
thiserror = "1.0"
tracing = "0.1"
specta = { version = "=2.0.0-rc.20", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"

