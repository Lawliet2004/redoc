[package]
name = "redoc-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
parking_lot = "0.12"
uuid = { version = "1.11", features = ["v7", "serde"] }
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
zip = "8.6.0"
